<!doctype html>
<html lang="zh-CN" class="preload">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/msime.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="陆凡的软件工程师个人简历" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>陆凡 | 软件工程师 / 独立开发者</title>

  <script>
    (() => {
      try {
        const theme = localStorage.getItem("msime-theme");
        document.documentElement.dataset.theme = ["light", "dark", "system"].includes(theme) ? theme : "system";
      } catch {
        document.documentElement.dataset.theme = "system";
      }
      // preload 只是给 dev 兜底：那时样式由脚本注入，得先把整页遮住。构建产物的样式表是 head 里的阻塞资源，首帧就有样式，再遮一层只会让每次换页先画一帧空白。dev server 会把 /@vite/client 插在 head 最前面，用它区分两种环境。
      if (!document.querySelector('script[src*="/@vite/client"]')) {
        document.documentElement.classList.remove("preload");
      }
    })();
  </script>
  <style>
    html { background-color: #202020; color-scheme: dark; }
    html[data-theme="light"] { background-color: #f3f5f7; color-scheme: light; }
    @media (prefers-color-scheme: light) {
      html[data-theme="system"] { background-color: #f3f5f7; color-scheme: light; }
    }
    body { background-color: inherit; }
    html.preload body { visibility: hidden; }
  </style>
</head>

<body class="resume-body"><div id="root"></div>
  <main class="resume-page">
    <article class="resume-content" id="resume-content" aria-live="polite"></article>
  </main>

  <script type="module" src="/src/app.tsx"></script>
</body>

</html>
