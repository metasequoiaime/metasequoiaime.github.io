  <title>隐私说明 | 水杉输入法</title>

  <script>
    (() => {
      try {
        const theme = localStorage.getItem("msime-theme");
        document.documentElement.dataset.theme = ["light", "dark", "system"].includes(theme) ? theme : "system";
      } catch {
        document.documentElement.dataset.theme = "system";
      }
      // preload 只是给 dev 兜底：那时样式由脚本注入，得先把整页遮住。构建产物的样式表是 head 里的阻塞资源，首帧就有样式，再遮一层只会让每次换页先画一帧空白。dev server 会把 /@vite/client 插在 head 最前面，用它区分两种环境。
      if (!document.querySelector('script[src*="/@vite/client"]')) {
        document.documentElement.classList.remove("preload");
      }
    })();
  </script>

  <style>
    html { background-color: #202020; color-scheme: dark; }
    html[data-theme="light"] { background-color: #f3f5f7; color-scheme: light; }
    @media (prefers-color-scheme: light) {
      html[data-theme="system"] { background-color: #f3f5f7; color-scheme: light; }
    }

    body {
      background-color: inherit;
    }

    html.preload body {
      visibility: hidden;
    }

  <script>
    // 当前 tab 的胶囊从上一页的位置滑过来。在解析阶段就把偏移算好，首帧不会先画到终点再跳回去。
    (() => {
      try {
        const here = location.pathname;
        const from = sessionStorage.getItem("msime-nav-from");
        sessionStorage.setItem("msime-nav-from", here);
        if (!from || from === here || !/^\/[a-z]*\/?$/.test(from)) return;
        const list = document.querySelector(".nav-list");
        const to = list && list.querySelector('.nav-link[aria-current="page"]');
        const prev = list && list.querySelector('.nav-link[href="' + from + '"]');
        if (!to || !prev) return;
        list.style.setProperty("--pill-from", prev.offsetLeft - to.offsetLeft + "px");
        list.classList.add("is-sliding");
      } catch {}
    })();
  </script>
