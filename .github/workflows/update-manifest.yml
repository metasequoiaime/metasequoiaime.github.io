name: Sync update manifest

# public/update.json is what the download page and the in-app "检查更新" both read, so a release that is not mirrored here is invisible to users. This job keeps the file in step with MSIME-Windows instead of relying on someone remembering to edit it by hand after every release.
#
# The highest published installer version wins, prereleases included. /releases/latest is deliberately not used: it skips prereleases, and every published release of this product is currently a prerelease, so it answers 404 here.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [update-manifest]

permissions:
  contents: read

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  sync:
    name: Propose the newest published release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_REPOSITORY: metasequoiaime/MSIME-Windows
      MANIFEST: public/update.json
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate and generate the manifest
        id: write
        run: |
          set -euo pipefail
          node --test scripts/generate-update.test.mjs
          node scripts/generate-update.mjs
          if git diff --quiet -- "$MANIFEST"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the PR automation credential
        env:
          AUTOMATION_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: test -n "$AUTOMATION_TOKEN"

      - name: Create or update the manifest PR
        id: proposal
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A trusted token triggers PR CI and deployment after merging.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          add-paths: public/update.json
          branch: automation/update-manifest
          base: main
          delete-branch: true
          commit-message: 'chore(release): sync validated Windows release metadata'
          title: 'chore(release): sync validated Windows release metadata'
          body: 'Generated from published Windows release assets after metadata regression tests. Auto-merge requires the normal build, workflow validation and dependency review.'

      - name: Enable auto-merge behind the required checks
        if: steps.proposal.outputs.pull-request-number != '' && steps.proposal.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.proposal.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.proposal.outputs.pull-request-head-sha }}
        run: python3 scripts/enable-manifest-automerge.py --repo "$GH_REPO" --pr "$PR_NUMBER" --sha "$HEAD_SHA"
